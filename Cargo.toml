[package]
name = "ipod_connection_utility"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Terminal iPod library sync and Apple Music download utility"
repository = "https://github.com/Mimmob07/ipod_connection_utility"
readme = "README.md"
license = "MIT"
keywords = ["ipod", "music", "sync", "tui", "apple-music"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "ipod-connection-utility"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.4"
libc = "0.2.177"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
