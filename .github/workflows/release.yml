name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # shortcut: 22.04 keeps the glibc 2.35 baseline; runner unsupported from 2027-04, switch to a pinned older-glibc container or cargo-zigbuild before then.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"; tag="${tag%%-*}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [[ "$tag" == "$version" ]] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [[ '${{ matrix.target }}' == aarch64-unknown-linux-gnu ]]; then
            # 64 KiB ELF alignment loads on 4K and 16K-page kernels (incl. Asahi).
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=65536'
          fi
          cargo build --release --locked --target '${{ matrix.target }}'
      - name: Validate ARM64 Linux load alignment
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: python3 tools/check_elf_pages.py --page-size 16384 --machine aarch64 'target/${{ matrix.target }}/release/ipod-connection-utility'
      - name: Package
        shell: bash
        run: |
          package="ipod-connection-utility-${{ matrix.target }}"
          bash scripts/package-release.sh \
            --binary "target/${{ matrix.target }}/release/ipod-connection-utility" \
            --target '${{ matrix.target }}' --output .
          tar -xzf "$package.tar.gz"
          "$package/bin/ipod-connection-utility" --version
          "$package/bin/ipod-connection-utility-setup-backend" --help
          "$package/bin/ipod-connection-utility-install" --help
          "$package/bin/ipod-connection-utility-install-dependencies" --help
          python3 tests/test_cli.py --binary "$package/bin/ipod-connection-utility"
          python3 tests/test_lifecycle.py --binary "$package/bin/ipod-connection-utility"
          python3 tests/test_first_run.py --binary "$package/bin/ipod-connection-utility"
          # The packager already generated the archive and adjacent checksum.
      - uses: actions/upload-artifact@v4
        with:
          name: ipod-connection-utility-${{ matrix.target }}
          path: ipod-connection-utility-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ipod-connection-utility-*
          merge-multiple: true
      - name: Combined checksums
        run: sha256sum ipod-connection-utility-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ipod-connection-utility-*.tar.gz
            ipod-connection-utility-*.tar.gz.sha256
            SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
